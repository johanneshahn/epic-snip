[package]
name = "epic-snip-poc"
version = "0.1.0"
edition = "2024"
description = "Research-only, in-memory model of a one-sided shared-redeemable payment"
license = "MIT"
publish = false

[dependencies]
grin_secp256k1zkp = { git = "https://github.com/EpicCash/rust-secp256k1-zkp.git", rev = "1131a20920576413cd949e012a160561080324c1" }
rand = "0.9"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
